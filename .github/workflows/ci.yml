# Cartethyia CI: backend + dashboard verification gates.
#
# Runs the repo's own runners:
# - backend job: typecheck.
# - dashboard job: dashboard:typecheck.

name: ci

on:
  push:
    # `dev` is the integration branch that receives pushes. It has to be named
    # explicitly: the repository's GitHub default branch is a separate branch
    # that does not carry this workflow, so an unnamed push filter would verify
    # neither the default branch nor the branch work actually lands on.
    branches: [dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run generate:usage-periods
      - run: bun run dashboard:typecheck
